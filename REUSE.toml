version = 1
SPDX-PackageName = "awesome-gpt-image-2-5-prompts"
SPDX-PackageSupplier = "Formative Intelligence Inc. <support@youart.ai>"
SPDX-PackageDownloadLocation = "https://github.com/youart-open-source/awesome-gpt-image-2-5-prompts"
SPDX-PackageComment = """
This is a mixed-licence repository. This file is the machine-readable map per
path; see LICENSE for the prose version and ATTRIBUTION.md for the terms and
author recorded for each third-party prompt.
"""

# Layer 1 -- the build scripts. Ours, and genuinely reusable.
[[annotations]]
path = ["scripts/**"]
SPDX-FileCopyrightText = "2026 Formative Intelligence Inc."
SPDX-License-Identifier = "MIT"

# Layer 2 -- YouArt-created curation, prose and translations.
[[annotations]]
path = [
  "README.md", "README.zh.md", "README.es.md", "README.ja.md",
  "README.ar.md", "README.pt.md",
  "content/**", "locales/**", "metadata/**",
  "llms.txt", "llms.txt.tmpl",
  "CONTRIBUTING.md", "TAKEDOWN.md", "ATTRIBUTION.md",
  "provenance/README.md",
  "data/prompts.schema.json", "data/removed.json",
  "package.json", ".gitignore", ".github/**",
]
SPDX-FileCopyrightText = "2026 Formative Intelligence Inc."
SPDX-License-Identifier = "CC-BY-4.0"
SPDX-FileComment = """
The CC BY 4.0 grant covers the YouArt-created portions of these files. The
third-party prompt titles and bodies embedded in generated files remain covered
by LicenseRef-Prompt-Authors-Per-Row and their records in ATTRIBUTION.md.
"""

# Layer 3 -- YouArt-generated example images.
[[annotations]]
path = ["images/**"]
SPDX-FileCopyrightText = "2026 Formative Intelligence Inc."
SPDX-License-Identifier = "CC-BY-4.0"

# Layer 4 -- third-party prompt bodies and titles. Each row retains the terms
# stated by its source collection; see ATTRIBUTION.md and data/prompts.json.
[[annotations]]
path = ["prompts/**", "data/prompts.json"]
SPDX-FileCopyrightText = "The individual prompt authors named in ATTRIBUTION.md"
SPDX-License-Identifier = "LicenseRef-Prompt-Authors-Per-Row"
SPDX-FileComment = """
8 of the 9 prompts/*.md files mix rows received under different stated terms,
so no single SPDX expression is accurate per file. The authoritative per-row
record is the `upstream` and `upstreamStatedTerms` fields in data/prompts.json,
surfaced in ATTRIBUTION.md.
"""

# Vendored evidence of what each upstream stated, at the commit we relied on.
[[annotations]]
path = ["provenance/evolink-e2a269ad-LICENSE.txt"]
SPDX-FileCopyrightText = "EvoLinkAI"
SPDX-License-Identifier = "CC0-1.0"

[[annotations]]
path = ["provenance/youmind-41572075-LICENSE.txt"]
SPDX-FileCopyrightText = "2026 YouMind OpenLab"
SPDX-License-Identifier = "CC-BY-4.0"
